<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="钟昊霖个人简历：大理大学医学影像学本科在读，校园经历、技能矩阵、教育背景与联系方式。">
<meta name="theme-color" content="#2f66ad">
<title>钟昊霖 · 个人简历</title>
<style>
  :root{
    /* 大理白族扎染 · 蓝地白花：板蓝靛青为地 · 白布为花 · 白族金线点缀 */
    --primary:#1c4e80;
    --primary-2:#35699f;
    --accent:#6b9bd1;
    --gold:#c9a35c;
    --bg:#2f66ad;
    --bg-deep:#234e8c;
    --bg-soft:#eef3f9;
    --card:#fffdf8;
    --text:#1b2f4b;
    --text-soft:#3f5673;
    --text-faint:#7d8fa5;
    --line:#e0e6ef;
    --chip-bg:#e7eef8;
    --chip-text:#1c4e80;
    /* 靛蓝底上的文字与描边 */
    --on-bg:#ffffff;
    --on-bg-soft:rgba(255,255,255,.85);
    --on-bg-faint:rgba(255,255,255,.62);
    --on-bg-line:rgba(255,255,255,.28);
    --shadow:0 10px 30px rgba(12,36,72,.34);
    --shadow-hover:0 18px 44px rgba(12,36,72,.46);
    --radius:16px;
    --nav-h:56px;
    --pad:clamp(16px,4vw,24px);
    color-scheme:light;
  }
  [data-theme="dark"]{
    /* 夜色扎染 · 深靛蓝地 · 月光为纹 */
    --primary:#8dbcec;
    --primary-2:#5c97d9;
    --accent:#a8c9ec;
    --gold:#d4b06a;
    --bg:#0d1f3c;
    --bg-deep:#081426;
    --bg-soft:#1d3350;
    --card:#152841;
    --text:#eaf1fa;
    --text-soft:#b9c8dc;
    --text-faint:#8296b0;
    --line:#2a4060;
    --chip-bg:rgba(255,255,255,.12);
    --chip-text:#bcd8f4;
    --on-bg:#eaf1fa;
    --on-bg-soft:rgba(234,241,250,.82);
    --on-bg-faint:rgba(234,241,250,.58);
    --on-bg-line:rgba(255,255,255,.18);
    --shadow:0 10px 28px rgba(0,0,0,.42);
    --shadow-hover:0 18px 42px rgba(0,0,0,.56);
    color-scheme:dark;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{
    scroll-behavior:smooth;
    scroll-padding-top:calc(var(--nav-h) + 14px);
    -webkit-text-size-adjust:100%;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:16px;
    line-height:1.7;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:background .25s ease,color .25s ease;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(620px 400px at 88% -8%,rgba(255,206,132,.18),transparent 62%),
      radial-gradient(240px 240px at 9% 13%,rgba(255,255,255,.13),transparent 68%),
      radial-gradient(140% 105% at 50% 16%,transparent 56%,rgba(9,26,54,.40)),
      radial-gradient(circle at 16% 12%,transparent 34px,rgba(255,255,255,.10) 36px,transparent 39px),
      radial-gradient(circle at 16% 12%,transparent 64px,rgba(255,255,255,.07) 66px,transparent 69px),
      radial-gradient(circle at 86% 30%,transparent 40px,rgba(255,255,255,.09) 42px,transparent 45px),
      radial-gradient(circle at 86% 30%,transparent 76px,rgba(255,255,255,.06) 78px,transparent 81px),
      radial-gradient(circle at 50% 92%,transparent 46px,rgba(255,255,255,.08) 48px,transparent 51px),
      radial-gradient(circle at 50% 92%,transparent 88px,rgba(255,255,255,.05) 90px,transparent 93px),
      linear-gradient(160deg,var(--bg) 0%,var(--bg-deep) 100%);
  }
  [data-theme="dark"] body::before{
    background:
      radial-gradient(620px 400px at 88% -8%,rgba(212,176,106,.10),transparent 62%),
      radial-gradient(240px 240px at 9% 13%,rgba(234,241,250,.10),transparent 68%),
      radial-gradient(140% 105% at 50% 16%,transparent 56%,rgba(0,0,0,.52)),
      radial-gradient(circle at 16% 12%,transparent 34px,rgba(168,201,236,.10) 36px,transparent 39px),
      radial-gradient(circle at 16% 12%,transparent 64px,rgba(168,201,236,.06) 66px,transparent 69px),
      radial-gradient(circle at 86% 30%,transparent 40px,rgba(168,201,236,.08) 42px,transparent 45px),
      radial-gradient(circle at 86% 30%,transparent 76px,rgba(168,201,236,.05) 78px,transparent 81px),
      radial-gradient(circle at 50% 92%,transparent 46px,rgba(168,201,236,.07) 48px,transparent 51px),
      linear-gradient(160deg,var(--bg) 0%,var(--bg-deep) 100%);
  }
  /* 棉麻织物经纬纹理 */
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
  }
  .wrap{width:100%;max-width:1020px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
  section{padding:clamp(36px,8vw,56px) 0 8px}
  h2.sec-title{font-size:clamp(1.25rem,4.5vw,1.5rem);letter-spacing:.02em;display:flex;align-items:center;gap:12px;margin-bottom:6px;color:var(--on-bg)}
  h2.sec-title::before{content:"";width:10px;height:26px;border-radius:6px;flex:none;background:linear-gradient(180deg,var(--gold),#e8cd92)}
  h2.sec-title::after{content:"◆";margin-left:2px;font-size:.62rem;color:var(--gold);opacity:.85}
  .sec-sub{color:var(--on-bg-faint);font-size:.92rem;margin-bottom:clamp(18px,4vw,26px)}
  /* 首屏以下模块：屏幕外跳过渲染，滚动接近时再绘制 */
  .cv-auto{content-visibility:auto;contain-intrinsic-size:auto 560px}

  /* ===== Nav（移动优先）===== */
  nav{
    position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:100;
    background:color-mix(in srgb,var(--bg) 90%,transparent);
    border-bottom:1px solid var(--on-bg-line);
  }
  .nav-inner{
    max-width:1020px;margin:0 auto;height:100%;display:flex;align-items:center;gap:8px;
    padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));
  }
  .brand{font-weight:800;font-size:1rem;white-space:nowrap;color:var(--on-bg)}
  .brand em{font-style:normal;background:linear-gradient(90deg,var(--gold),#f0dcab);-webkit-background-clip:text;background-clip:text;color:transparent}
  .nav-links{display:flex;gap:2px;margin-left:4px;flex:1;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{
    color:var(--on-bg-soft);text-decoration:none;font-size:.88rem;padding:10px;border-radius:10px;white-space:nowrap;flex:none;
    transition:background .18s ease,color .18s ease;
  }
  .nav-links a:hover,.nav-links a:focus-visible{background:var(--chip-bg);color:var(--chip-text)}
  .nav-btn{
    border:1px solid var(--on-bg-line);background:rgba(255,255,255,.16);color:var(--on-bg);border-radius:12px;
    min-width:42px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:0 10px;font-size:1.05rem;cursor:pointer;white-space:nowrap;flex:none;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
  }
  .nav-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--gold);background:rgba(255,255,255,.24)}
  .nav-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .nav-btn .btn-txt{display:none;font-size:.88rem}

  /* ===== Hero ===== */
  .hero{padding-top:calc(var(--nav-h) + clamp(20px,5vw,52px))}
  .hero-card{
    background:linear-gradient(150deg,#fffef9 0%,var(--card) 55%);
    border:1px solid rgba(28,78,128,.16);border-radius:clamp(18px,4vw,24px);box-shadow:var(--shadow);
    padding:clamp(24px,6vw,44px) clamp(20px,5vw,40px);position:relative;overflow:hidden;color:var(--text);
  }
  /* 白族菱形绣纹带（首屏底部装饰） */
  .hero-card::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:12px;
    background:
      linear-gradient(135deg,rgba(28,78,128,.85) 25%,transparent 25%) 0 0/16px 16px,
      linear-gradient(225deg,rgba(28,78,128,.85) 25%,transparent 25%) 0 0/16px 16px,
      linear-gradient(315deg,rgba(201,163,92,.9) 25%,transparent 25%) 0 0/16px 16px;
    opacity:.30;pointer-events:none;
  }
  [data-theme="dark"] .hero-card{background:linear-gradient(150deg,#17294280 0%,var(--card) 60%);border-color:var(--line);color:var(--text)}
  [data-theme="dark"] .hero-card::before{
    background:
      linear-gradient(135deg,rgba(168,201,236,.55) 25%,transparent 25%) 0 0/16px 16px,
      linear-gradient(225deg,rgba(168,201,236,.55) 25%,transparent 25%) 0 0/16px 16px,
      linear-gradient(315deg,rgba(212,176,106,.6) 25%,transparent 25%) 0 0/16px 16px;
    opacity:.28;
  }
  .hero-card::after{
    content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,163,92,.22),transparent 70%);
  }
  .hero-top{display:flex;align-items:center;gap:clamp(14px,4vw,22px);flex-wrap:wrap;position:relative;z-index:1}
  .avatar{
    width:clamp(64px,18vw,88px);height:clamp(64px,18vw,88px);border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:clamp(1.5rem,5vw,2rem);font-weight:800;
    box-shadow:0 8px 20px rgba(28,78,128,.35),0 0 0 3px rgba(201,163,92,.55);
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;border-radius:50%}
  .hero h1{font-size:clamp(1.55rem,6vw,2rem);letter-spacing:.04em}
  .hero .role{color:var(--primary);font-weight:600;margin-top:2px;font-size:clamp(.9rem,3vw,1rem)}
  .hero .meta{color:var(--text-faint);font-size:.9rem;margin-top:6px;display:flex;gap:8px 12px;flex-wrap:wrap}
  .hero .meta span{display:inline-flex;align-items:center;gap:5px}
  .hero p.intro{margin:clamp(16px,4vw,22px) 0 clamp(14px,3vw,18px);color:var(--text-soft);max-width:760px;position:relative;z-index:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
  .chip{
    background:var(--chip-bg);color:var(--chip-text);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:600;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .chip:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .hero-cta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:clamp(18px,4vw,26px);position:relative;z-index:1}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;
    min-height:48px;padding:12px 18px;font-size:.95rem;cursor:pointer;
    text-decoration:none;font-weight:600;border:1px solid transparent;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn-primary{background:linear-gradient(90deg,var(--primary),var(--primary-2));color:#fff;grid-column:1/-1}
  .btn-ghost{background:rgba(28,78,128,.06);border-color:rgba(28,78,128,.28);color:var(--primary)}
  [data-theme="dark"] .btn-ghost{background:var(--chip-bg);border-color:var(--line);color:var(--chip-text)}
  .btn-ghost:hover{border-color:var(--gold)}

  /* ===== Highlights ===== */
  .hl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .hl-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .hl-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover)}
  .hl-num{font-size:clamp(1.35rem,5vw,1.7rem);font-weight:800;background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hl-label{color:var(--text-soft);font-size:.88rem;margin-top:4px}

  /* ===== Tabs ===== */
  .tabs-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,4vw,26px)}
  .tablist{
    display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:clamp(14px,3vw,20px);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
  }
  .tablist::-webkit-scrollbar{display:none}
  .tab-btn{
    border:1px solid var(--line);background:transparent;color:var(--text-soft);border-radius:12px;
    min-height:44px;padding:10px 18px;font-size:.92rem;cursor:pointer;font-weight:600;flex:none;scroll-snap-align:start;
    transition:background .18s ease,color .18s ease,border-color .18s ease;
  }
  .tab-btn:hover{border-color:var(--primary);color:var(--primary)}
  .tab-btn[aria-selected="true"]{background:linear-gradient(90deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
  .tab-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .tabpanel[hidden]{display:none}
  .exp-head{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin-bottom:4px}
  .exp-head h3{font-size:1.1rem}
  .exp-org{color:var(--primary);font-weight:600;font-size:.95rem}
  .exp-time{margin-left:auto;color:var(--text-faint);font-size:.84rem;background:var(--bg-soft);padding:4px 12px;border-radius:999px}
  .exp-points{list-style:none;margin-top:12px}
  .exp-points li{position:relative;padding:6px 0 6px 24px;color:var(--text-soft);font-size:.95rem}
  .exp-points li::before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent))}
  .empty-hint{color:var(--text-faint);font-size:.9rem;text-align:center;padding:30px 0}

  /* ===== Skills ===== */
  .skill-grid{display:grid;grid-template-columns:1fr;gap:14px}
  .skill-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
  .skill-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .skill-card h3{font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .skill-row{margin-bottom:14px}
  .skill-row:last-child{margin-bottom:0}
  .skill-row .lb{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--text-soft);margin-bottom:6px}
  .bar{height:8px;border-radius:99px;background:var(--bg-soft);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));width:0;transition:width .9s cubic-bezier(.22,.7,.35,1)}
  .badge-row{display:flex;flex-wrap:wrap;gap:8px}
  .badge{background:var(--chip-bg);color:var(--chip-text);font-size:.84rem;font-weight:600;border-radius:9px;padding:8px 14px}

  /* ===== Timeline (education) ===== */
  .timeline{position:relative;padding-left:24px}
  .timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--gold),rgba(255,255,255,.35));opacity:.6}
  .tl-item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;transition:transform .2s ease,box-shadow .2s ease}
  .tl-item:hover{transform:translateX(4px);box-shadow:var(--shadow-hover)}
  .tl-item::before{content:"";position:absolute;left:-23px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(201,163,92,.25)}
  .tl-item h3{font-size:1.02rem;display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center}
  .tl-item .tl-time{color:var(--text-faint);font-size:.84rem;font-weight:400;flex-basis:100%}
  .tl-item p{color:var(--text-soft);font-size:.92rem;margin-top:6px}

  /* ===== Awards ===== */
  .award-grid{display:grid;grid-template-columns:1fr;gap:12px}
  .award{
    display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease;
  }
  .award:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .award .ico{width:42px;height:42px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 26%,var(--card)),var(--card))}
  .award b{font-size:.94rem;display:block}
  .award small{color:var(--text-faint)}
  .award{flex-wrap:wrap}
  .award-img-wrap{
    flex-basis:100%;margin-top:10px;border-radius:10px;overflow:hidden;cursor:zoom-in;position:relative;
    border:1px solid var(--line);background:var(--bg-soft);
  }
  .award-img-wrap:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .award-img{display:block;width:100%;height:150px;object-fit:cover;transition:transform .3s ease}
  .award-img-wrap:hover .award-img{transform:scale(1.04)}
  .award-img-wrap::after{
    content:"🔍 点击放大";position:absolute;right:8px;bottom:8px;
    background:rgba(12,36,72,.62);color:#fff;font-size:.72rem;padding:3px 9px;border-radius:999px;
    opacity:0;transition:opacity .2s ease;pointer-events:none;
  }
  .award-img-wrap:hover::after,.award-img-wrap:focus-visible::after{opacity:1}

  /* 证书大图预览（lightbox） */
  #lightbox{
    position:fixed;inset:0;z-index:300;background:rgba(8,20,38,.86);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:24px;cursor:zoom-out;opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  #lightbox.show{opacity:1;pointer-events:auto}
  #lightbox img{
    max-width:min(92vw,860px);max-height:78vh;border-radius:10px;background:#fff;
    box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.96);transition:transform .22s ease;cursor:default;
  }
  #lightbox.show img{transform:scale(1)}
  #lightbox .lb-cap{color:rgba(255,255,255,.88);font-size:.92rem;text-align:center}
  #lightbox .lb-close{
    position:absolute;top:calc(14px + env(safe-area-inset-top));right:18px;
    width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.12);color:#fff;font-size:1.1rem;cursor:pointer;
  }

  /* ===== Footer / misc ===== */
  footer{
    margin-top:clamp(44px,8vw,64px);border-top:1px solid var(--on-bg-line);color:var(--on-bg-faint);font-size:.86rem;
    display:flex;flex-direction:column;gap:6px;
    padding:22px 0 calc(28px + env(safe-area-inset-bottom));
  }
  #backTop{
    position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));
    width:48px;height:48px;border-radius:50%;border:1px solid rgba(201,163,92,.5);
    background:var(--card);color:var(--primary);font-size:1.25rem;cursor:pointer;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .2s ease;z-index:90;
  }
  #backTop.show{opacity:1;pointer-events:auto}
  #backTop:hover{transform:translateY(-3px)}
  #toast{
    position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:#fffdf8;color:var(--primary);max-width:calc(100vw - 32px);text-align:center;
    padding:10px 22px;border-radius:999px;font-size:.9rem;font-weight:600;box-shadow:var(--shadow-hover);
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:200;
  }
  [data-theme="dark"] #toast{background:#eaf1fa;color:#1c4e80}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fade-in{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
  .fade-in.visible{opacity:1;transform:none}

  /* ===== ≥600px：平板/小桌面增强 ===== */
  @media (min-width:600px){
    :root{--nav-h:60px}
    .nav-inner{gap:14px;padding-left:20px;padding-right:20px}
    .nav-btn{padding:0 12px}
    .nav-btn .btn-txt{display:inline}
    .hero-cta{display:flex;flex-wrap:wrap;gap:12px}
    .btn-primary{grid-column:auto}
    .hl-grid{grid-template-columns:repeat(3,1fr);gap:16px}
    .skill-grid{grid-template-columns:repeat(2,1fr);gap:16px}
    .award-grid{grid-template-columns:repeat(2,1fr);gap:14px}
    .tl-item .tl-time{flex-basis:auto;margin-left:auto}
    footer{flex-direction:row;justify-content:space-between;gap:12px}
  }
  /* ===== ≥960px：桌面增强 ===== */
  @media (min-width:960px){
    nav{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .nav-links{gap:4px;margin-left:8px}
    .nav-links a{padding:8px 12px;font-size:.9rem}
    .hl-grid{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
    .hl-card{padding:22px 20px}
    .award-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition:none!important;animation:none!important}
    .fade-in{opacity:1;transform:none}
  }

  /* ===== Print ===== */
  @media print{
    nav,#backTop,.hero-cta,#toast{display:none!important}
    body{background:#fff;color:#111}
    body::before,body::after{display:none}
    h2.sec-title{color:#111}
    .sec-sub{color:#666}
    section{padding:18px 0}
    .cv-auto{content-visibility:visible;contain-intrinsic-size:auto}
    .hero{padding-top:10px}
    .hl-card,.tabs-card,.skill-card,.tl-item,.award,.hero-card{box-shadow:none;break-inside:avoid}
    .fade-in{opacity:1!important;transform:none!important}
    a{color:inherit;text-decoration:none}
    .tabpanel[hidden]{display:block!important}
    .tablist{display:none}
  }
</style>

const $ = (sel) => document.querySelector(sel);
function el(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html !== undefined) n.innerHTML = html;
  /* 若未来数据中出现图片：统一懒加载 + 异步解码 */
  if(tag === "img"){ n.loading = "lazy"; n.decoding = "async"; }
  return n;
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

  $("#heroIntro").textContent = resume.intro;
  const chips = $("#heroChips");
  resume.keywords.forEach(k => chips.appendChild(el("span","chip",k)));
  $("#mailtoBtn").href = "mailto:" + getEmail();
}

function renderHighlights(){
  const grid = $("#hlGrid");
  resume.highlights.forEach(h => {
    const c = el("div","hl-card fade-in");
    c.appendChild(el("div","hl-num",h.num));
    c.appendChild(el("div","hl-label",h.label));
    grid.appendChild(c);
  });
}

function renderTabs(){
  const items = resume.campusExperience;
  const sec = $("#experience");
  if(!items.length){ sec.style.display = "none"; return; }
  const tablist = $("#expTabs");
  const panels = $("#expPanels");
  items.forEach((exp, i) => {
    const btn = el("button","tab-btn",exp.title);
    btn.type = "button";
    btn.role = "tab";
    btn.id = "exp-tab-" + i;
    btn.setAttribute("aria-controls","exp-panel-" + i);
    btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
    btn.tabIndex = i === 0 ? 0 : -1;
    btn.addEventListener("click", () => selectTab(i));
    tablist.appendChild(btn);

    const panel = el("div",null);
    panel.className = "tabpanel fade-in visible";
    panel.id = "exp-panel-" + i;
    panel.role = "tabpanel";
    panel.setAttribute("aria-labelledby","exp-tab-" + i);
    if(i !== 0) panel.hidden = true;

    const head = el("div","exp-head");
    head.appendChild(el("h3",null,exp.title));
    head.appendChild(el("span","exp-org",exp.org));
    head.appendChild(el("span","exp-time",exp.time));
    panel.appendChild(head);

    const ul = el("ul","exp-points");
    exp.points.forEach(p => ul.appendChild(el("li",null,p)));
    panel.appendChild(ul);
    panels.appendChild(panel);
  });

  /* 键盘左右切换 */
  tablist.addEventListener("keydown", (e) => {
    if(e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault();
    const cur = [...tablist.children].findIndex(b => b.getAttribute("aria-selected") === "true");
    let next = e.key === "ArrowRight" ? cur + 1 : cur - 1;
    next = (next + items.length) % items.length;
    selectTab(next);
    tablist.children[next].focus();
  });

  function selectTab(i){
    [...tablist.children].forEach((b, j) => {
      b.setAttribute("aria-selected", j === i ? "true" : "false");
      b.tabIndex = j === i ? 0 : -1;
    });
    [...panels.children].forEach((p, j) => { p.hidden = j !== i; });
  }
}

function renderSkills(){
  const grid = $("#skillGrid");
  resume.skills.forEach(group => {
    const card = el("div","skill-card fade-in");
    card.appendChild(el("h3",null,group.title));
    if(group.bars){
      group.bars.forEach(b => {
        const row = el("div","skill-row");
        const lb = el("div","lb");
        lb.appendChild(el("span",null,b.name));
        lb.appendChild(el("span",null,(b.note || b.level + "%")));
        row.appendChild(lb);
        const bar = el("div","bar");
        const fill = el("i");
        fill.dataset.level = b.level;
        bar.appendChild(fill);
        row.appendChild(bar);
        card.appendChild(row);
      });
    }
    if(group.badges){
      const box = el("div","badge-row");
      group.badges.forEach(t => box.appendChild(el("span","badge",t)));
      card.appendChild(box);
    }
    grid.appendChild(card);
  });
}

function renderEducation(){
  const tl = $("#eduTimeline");
  resume.education.forEach(edu => {
    const item = el("div","tl-item fade-in");
    const head = el("h3");
    head.appendChild(el("span",null,edu.school));
    head.appendChild(el("span","exp-org",edu.degree));
    head.appendChild(el("span","tl-time",edu.time));
    item.appendChild(head);
    item.appendChild(el("p",null,edu.note));
    tl.appendChild(item);
  });
}

function renderAwards(){
  const grid = $("#awardGrid");
  resume.awards.forEach(a => {
    const card = el("div","award fade-in");
    card.appendChild(el("div","ico",a.icon));
    const txt = el("div");
    txt.appendChild(el("b",null,a.name));
    txt.appendChild(el("small",null,a.year));
    card.appendChild(txt);
    if(a.img){
      const wrap = el("div","award-img-wrap");
      wrap.tabIndex = 0;
      wrap.setAttribute("role","button");
      wrap.setAttribute("aria-label","放大查看：" + a.name);
      const img = el("img","award-img");
      img.src = a.img;
      img.alt = a.name + " 证书图片";
      img.loading = "lazy";
      img.decoding = "async";
      wrap.appendChild(img);
      wrap.addEventListener("click", () => openLightbox(a.img, a.name));
      wrap.addEventListener("keydown", (e) => {
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openLightbox(a.img, a.name); }
      });
      card.appendChild(wrap);
    }
    grid.appendChild(card);
  });
}

function renderFooter(){
  $("#footerCopy").textContent = "© 2026 " + resume.name + " · 个人简历网站";
  $("#footerUpdate").textContent = "更新于 " + resume.updatedAt;
}

/* ================= 交互 ================= */
/* 主题切换：跟随系统 + 手动覆盖并记忆，同步地址栏主题色 */
const themeBtn = $("#themeBtn");
function applyTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.content = mode === "dark" ? "#081426" : "#2f66ad";
  try{ localStorage.setItem("resume-theme", mode); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem("resume-theme"); }catch(e){}
  if(saved){ applyTheme(saved); }
  else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){ applyTheme("dark"); }
  else{ applyTheme("light"); }
})();
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
});

/* 打印 */
$("#printBtn").addEventListener("click", () => window.print());

/* 邮箱复制（拼接防爬虫） */
$("#copyEmailBtn").addEventListener("click", () => {
  const email = getEmail();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(email)
      .then(() => toast("邮箱已复制：" + email))
      .catch(() => fallbackCopy(email));
  } else {
    fallbackCopy(email);
  }
});
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand("copy");
    toast("邮箱已复制：" + text);
  }catch(e){
    toast("复制失败，请手动记录邮箱");
  }
  document.body.removeChild(ta);
}

/* 返回顶部：rAF 节流滚动监听 */
const backTop = $("#backTop");
let ticking = false;
window.addEventListener("scroll", () => {
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    backTop.classList.toggle("show", window.scrollY > 480);
    ticking = false;
  });
}, { passive: true });
backTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

/* 证书大图预览 */
const lightbox = $("#lightbox");
const lbImg = $("#lbImg");
function openLightbox(src, caption){
  lbImg.src = src;
  lbImg.alt = caption + " 证书大图";
  $("#lbCap").textContent = caption;
  lightbox.classList.add("show");
}
function closeLightbox(){
  lightbox.classList.remove("show");
  lbImg.src = "";
}
lightbox.addEventListener("click", (e) => { if(e.target === lightbox) closeLightbox(); });
$("#lbClose").addEventListener("click", closeLightbox);
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && lightbox.classList.contains("show")) closeLightbox();
});

/* 进入淡入 + 技能条动画（无 IO 环境直接显示） */
let io = null;
if("IntersectionObserver" in window){
  io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if(!en.isIntersecting) return;
      en.target.classList.add("visible");
      en.target.querySelectorAll("i[data-level]").forEach(fill => {
        fill.style.width = fill.dataset.level + "%";
      });
      io.unobserve(en.target);
    });
  }, { threshold: 0.15 });
}

/* ================= 启动 ================= */
renderNav();
renderHero();
renderHighlights();
renderTabs();
renderSkills();
renderEducation();
renderAwards();
renderFooter();

if(io){
  document.querySelectorAll(".fade-in").forEach(n => io.observe(n));
  document.querySelectorAll("#skillGrid .skill-card").forEach(n => io.observe(n));
}else{
  document.querySelectorAll(".fade-in").forEach(n => n.classList.add("visible"));
  document.querySelectorAll("i[data-level]").forEach(f => { f.style.width = f.dataset.level + "%"; });
}
</script>
